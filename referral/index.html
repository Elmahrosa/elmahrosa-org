<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirecting — Elmahrosa International</title>
  <meta name="robots" content="noindex, nofollow">
  <style>
    body { background: #0a0d12; color: #e8e6e1; font-family: 'DM Mono', monospace; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
    .msg { text-align: center; }
    .msg h1 { font-size: 1.2rem; font-weight: 400; margin-bottom: 0.5rem; }
    .msg p { font-size: 0.75rem; color: rgba(232,230,225,0.5); }
    .spinner { width: 24px; height: 24px; border: 2px solid rgba(96,175,147,0.2); border-top-color: #60af93; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 1rem; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="msg">
    <div class="spinner"></div>
    <h1>Redirecting to TEOS Sentinel Shield...</h1>
    <p id="status">Processing referral link</p>
  </div>
  <script>
    (function() {
      var params = new URLSearchParams(window.location.search);
      var eid = params.get('eid');
      var timestamp = new Date().toISOString();
      var status = document.getElementById('status');

      // Default destination
      var dest = 'https://sentinel.teosegypt.com';

      if (eid) {
        // Log referral attribution
        console.log('[REFERRAL] eid=' + eid + ' | timestamp=' + timestamp + ' | source=anthropic_cpn | channel=linkedin');

        // Build redirect URL with referral metadata
        dest = 'https://sentinel.teosegypt.com?ref=' + encodeURIComponent(eid) + '&source=anthropic_cpn&channel=linkedin&date=' + encodeURIComponent(timestamp);

        status.textContent = 'Referral: ' + eid + ' — redirecting...';
      } else {
        status.textContent = 'No referral ID — redirecting to Sentinel Shield...';
      }

      // Redirect after brief delay for UX
      setTimeout(function() {
        window.location.href = dest;
      }, 800);
    })();
  </script>
</body>
</html>
