<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, follow" />
  <title>Page not found — Elmahrosa International</title>
  <meta name="description" content="That page does not exist on elmahrosa.org. Return to the homepage or the TEOS product index." />
  <link rel="icon" type="image/png" href="/icons/favicon.png" />
  <style>
    :root { --bg:#0a0d12; --text:#e8e6e1; --dim:rgba(232,230,225,.72); --teal:#60af93; --border:rgba(232,230,225,.14); }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--text);
           font-family:'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif; padding:2rem; }
    .box { max-width:34rem; text-align:center; }
    .code { font-family:ui-monospace,'DM Mono',SFMono-Regular,Menlo,monospace; font-size:.72rem; letter-spacing:.18em;
            text-transform:uppercase; color:var(--teal); }
    h1 { font-size:2rem; font-weight:300; margin:.6rem 0 1rem; }
    p  { color:var(--dim); font-size:1rem; line-height:1.65; margin:0 0 2rem; }
    nav { display:flex; flex-wrap:wrap; gap:.75rem; justify-content:center; }
    a { color:var(--text); text-decoration:none; border:1px solid var(--border); border-radius:2px;
        padding:.6rem 1rem; font-size:.9rem; }
    a:hover, a:focus-visible { border-color:var(--teal); color:var(--teal); outline:2px solid transparent; }
  </style>
</head>
<body>
  <main class="box">
    <div class="code">404 — not found</div>
    <h1>This page does not exist on elmahrosa.org.</h1>
    <p>The TEOS stack pages live under <code>/architecture</code>, <code>/security</code>, <code>/health</code> and friends. If you followed a link from elsewhere, the page may have moved.</p>
    <nav aria-label="Recovery links">
      <a href="/">Home</a>
      <a href="/#products">Products</a>
      <a href="/#pricing">Pricing</a>
      <a href="/trust/">Trust Center</a>
      <a href="/security-advisory/">Security Advisory</a>
      <a href="mailto:ayman@elmahrosa.org">Report a broken link</a>
    </nav>
  </main>
</body>
</html>
